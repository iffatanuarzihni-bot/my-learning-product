<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Academy | Dunia Pembelajaran</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1740;--paper:#fff8e7;--pri:#7c4dff;--gold:#ffc933;--grn:#2ecc71;--red:#ff4d6d;--mut:#5b5680}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:600 16px/1.5 "Baloo 2",system-ui,sans-serif;background:linear-gradient(#25156b,#4a2fb0 50%,#1e7fd6) fixed;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 140px 90px,#ffe9a0,transparent),radial-gradient(1.5px 1.5px at 80px 160px,#fff,transparent),radial-gradient(2px 2px at 200px 40px,#fff,transparent);background-size:240px 200px;animation:twinkle 2.5s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.25}}
.wrap{position:relative;max-width:900px;margin:0 auto;padding:1.2rem 1rem 3rem;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
h1,h2{margin:0 0 .5rem;line-height:1.3}
h1{font:400 1.2rem/1.6 "Press Start 2P","Courier New",monospace;color:var(--gold);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
h1.logo{font-size:1.5rem;text-align:center;animation:glow 2s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.04) rotate(-1deg)}}
h2{font-size:1.3rem;font-weight:800}
.sub{color:#e6defc;text-align:center;margin:.2rem 0 1rem}
.mut{color:var(--mut)}.top .mut{color:#e6defc}
button{font:inherit;font-weight:800;cursor:pointer;border:3px solid var(--ink);border-radius:12px;padding:.55rem 1rem;background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}
button:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button.ghost{background:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
input{font:inherit;padding:.55rem .7rem;border:3px solid var(--ink);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
label{display:block;font-weight:800;font-size:.9rem;margin-bottom:.2rem}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:1.1rem;margin-bottom:1.2rem;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;align-items:end}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}
.tag{display:inline-block;padding:0 .6rem;border:2px solid var(--ink);border-radius:99px;font-size:.8rem;font-weight:800;background:#d9ccff}
.tag.ok{background:#b8f2cd}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.5rem .4rem;border-bottom:2px dashed #d9cfb5;vertical-align:middle}
th{font-size:.85rem;color:var(--mut)}
.scroll{overflow-x:auto}
.bar{height:16px;background:#e5dcc3;border:3px solid var(--ink);border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:linear-gradient(#5df29a,#1fb86b);transition:width .6s}
.xp i{background:linear-gradient(#ffe066,#ffb300)}.hp.low i{background:linear-gradient(#ff8fa3,#ff4d6d)}
.err{background:#ffe0e6;color:#b3173a;border:3px solid var(--ink);padding:.6rem .8rem;border-radius:12px;margin-bottom:1rem}
.q{margin:1rem 0}
.mon svg{display:block;margin:auto;max-width:100%;height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.sil svg{filter:brightness(0) opacity(.35)}
.float{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.parade{display:flex;justify-content:center;gap:1rem;margin:.5rem 0 1rem}.parade .mon{width:90px}
.roles{display:grid;gap:1rem;margin-top:1rem}
.role{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;padding:.7rem 1rem;background:var(--paper);box-shadow:0 6px 0 rgba(0,0,0,.35);border-radius:18px}
.role .mon{width:80px;flex:none}.role strong{font-size:1.4rem;display:block}
.role:hover .mon{animation:jump .5s}
@keyframes jump{40%{transform:translateY(-16px) scale(1.08)}}
.stage{display:flex;align-items:center;gap:1rem}.stage .mon{width:84px;flex:none}.grow{flex:1;min-width:0}
.hud{display:flex;gap:1rem;align-items:center}.avatar{font-size:2.6rem}
.strip{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.7rem}.strip .mon{width:46px}
.arena{position:relative;height:290px;margin-bottom:1.2rem;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:linear-gradient(#8fd3ff 0 58%,#6fcf6f 58%);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.cloud{position:absolute;top:14%;font-size:2rem;animation:drift 16s linear infinite}
@keyframes drift{from{left:-10%}to{left:105%}}
.enemy{position:absolute;right:9%;top:48px;width:130px}
.enemy:after{content:"";position:absolute;left:5%;right:5%;bottom:-8px;height:16px;border-radius:50%;background:rgba(0,0,0,.2);z-index:-1}
.enemy .mon{animation:bob 2s ease-in-out infinite}
.trainer{position:absolute;left:10%;bottom:14px;font-size:4rem;animation:bob 3s ease-in-out infinite}
.plate{position:absolute;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:.2rem .6rem;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.plate.en{left:4%;top:12px;width:46%}.plate.me{right:4%;bottom:12px}
.hit{animation:hit .5s}.miss{animation:hit .4s}
@keyframes hit{20%{transform:translateX(-12px);filter:brightness(2)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}}
.miss:after{content:"";position:absolute;inset:0;background:rgba(255,0,60,.35);animation:flash .5s forwards}
@keyframes flash{to{opacity:0}}
.dmg{position:absolute;left:30%;top:-8px;font:400 1.2rem "Press Start 2P",monospace;color:var(--red);text-shadow:2px 2px 0 var(--ink);animation:up .9s forwards}
@keyframes up{to{opacity:0;transform:translateY(-50px)}}
.opts{display:grid;gap:.6rem;margin-top:.6rem}.opts.lock{pointer-events:none}
.opts button{text-align:left;background:#fff}
.opts .ok{background:var(--grn);color:#fff}.opts .no{background:var(--red);color:#fff}.opts .dim{opacity:.5}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:.8rem 1rem;margin:.8rem 0;text-align:left}
.center{text-align:center}.big{font:400 2.2rem "Press Start 2P",monospace;margin:.4rem 0}
.capt{position:relative;height:150px;display:grid;place-items:center}
.capt .mon{width:120px;opacity:0;animation:appear .5s 2s forwards}
@keyframes appear{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.orb{position:absolute;width:72px;height:72px;border-radius:50%;border:4px solid var(--ink);background:linear-gradient(var(--pri) 0 44%,var(--ink) 44% 56%,#fff 56%);animation:orb 2s ease-in-out forwards}
.orb:after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:var(--gold);border:3px solid var(--ink)}
@keyframes orb{0%{transform:translateY(-130px) scale(.5);opacity:0}20%{transform:none;opacity:1}35%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}65%{transform:rotate(-25deg)}80%{transform:rotate(0)}100%{transform:scale(1.9);opacity:0}}
.spark{position:absolute;font-size:1.6rem;opacity:0;animation:appear .6s 2.1s forwards,twinkle 1s 2.7s infinite alternate}
.flee{width:120px;margin:0 auto;animation:flee 1.2s forwards}
@keyframes flee{to{transform:translateX(220px) rotate(25deg);opacity:0}}
@media (max-width:520px){h1.logo{font-size:1.05rem}.enemy{width:105px}.role .mon{width:64px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ==================== TEMA POKÉMON ACADEMY ==================== */
:root{--ink:#19324d;--paper:#fffdf3;--pri:#2a75bb;--gold:#ffcb05;--grn:#54b96b;--red:#e63946;--mut:#63758a;--poke-blue:#2a75bb;--poke-red:#e63946}
body{background:linear-gradient(180deg,#80d6ff 0%,#b8edff 34%,#e7f8d8 70%,#a5d989 100%) fixed;color:var(--ink)}
body:before{background-image:radial-gradient(3px 3px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 140px 90px,#fff6bd,transparent),radial-gradient(2px 2px at 80px 160px,#fff,transparent),radial-gradient(3px 3px at 200px 40px,#fff,transparent);background-size:240px 200px;opacity:.8}
.wrap{z-index:1;max-width:980px;padding-top:1.35rem}
.pokemon-background{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bg-pokemon{position:absolute;width:clamp(72px,10vw,132px);height:auto;image-rendering:pixelated;opacity:.55;filter:drop-shadow(0 7px 4px #28506b33);animation:bgFloat 7s ease-in-out infinite}
.bg-pikachu{left:1.2%;top:19%;animation-delay:-1s}.bg-jigglypuff{right:1.2%;top:43%;width:clamp(70px,8vw,108px);animation-delay:-3s}.bg-eevee{left:4%;bottom:2%;width:clamp(86px,11vw,142px);animation-delay:-5s}
@keyframes bgFloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-22px) rotate(5deg)}}
.bg-cloud{position:absolute;width:115px;height:35px;border-radius:50px;background:#fff;opacity:.5;filter:blur(1px);animation:cloudMove 34s linear infinite}
.bg-cloud:before,.bg-cloud:after{content:"";position:absolute;bottom:9px;background:#fff;border-radius:50%}.bg-cloud:before{width:48px;height:48px;left:17px}.bg-cloud:after{width:58px;height:58px;right:15px}
.cloud-one{top:13%;left:-140px}.cloud-two{top:60%;left:-220px;animation-delay:-17s;transform:scale(.75)}
@keyframes cloudMove{to{left:110%}}
.bg-pokeball{position:absolute;right:7%;bottom:7%;width:54px;height:54px;border:4px solid #19324d;border-radius:50%;background:linear-gradient(#e63946 0 46%,#19324d 46% 54%,#fff 54%);opacity:.16;animation:slowSpin 12s linear infinite}
.bg-pokeball:after{content:"";position:absolute;width:14px;height:14px;left:50%;top:50%;transform:translate(-50%,-50%);border:3px solid #19324d;border-radius:50%;background:#fff}
@keyframes slowSpin{to{transform:rotate(360deg)}}
h1{color:#ffcb05;text-shadow:3px 3px 0 #19324d,-2px -2px 0 #19324d,2px -2px 0 #19324d,-2px 2px 0 #19324d}
h1.logo{font-size:clamp(1.05rem,3vw,1.55rem);letter-spacing:.02em;text-shadow:3px 3px 0 #1b3552,5px 5px 0 #e63946}
.sub{color:#214a69;font-size:1.05rem;font-weight:800;text-shadow:0 1px 0 #fff9}
.card{background:rgba(255,253,243,.96);border:3px solid #244764;border-radius:20px;box-shadow:0 7px 0 #24476433,0 14px 28px #21445b14}
button{border-color:#19324d;background:#ffcb05;box-shadow:0 5px 0 #19324d;color:#19324d}
button:hover{filter:saturate(1.08)}button.ghost{background:#fff;border-color:#2a75bb;color:#214b6c}
input{border-color:#7195aa}
.top{align-items:center}.top h1{color:#ffcb05}
.tag{background:#d8efff;border-color:#244764;color:#214b6c}.tag.ok{background:#d7f6d9;color:#225c37}
.bar{border-color:#244764;background:#e2edf0}.bar i{background:linear-gradient(#84e59a,#36a85b)}
.err{border-color:#9c2632}
.mon{display:flex;align-items:center;justify-content:center;flex:none}
.mon img,.pokemon-sprite{display:block;max-width:100%;height:auto;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 7px 3px #18324a2b)}
.mon img{width:100%;height:100%}.sil img{filter:grayscale(1) brightness(.25);opacity:.45}
.float{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ==================== SKRIN MULA (GAME START SCREEN) ==================== */
.start-screen{
  position:relative;
  min-height:82vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2rem 1.4rem 2.4rem;
  border:5px solid #19324d;
  border-radius:28px;
  background:radial-gradient(circle at 50% 35%, #2b4c7e 0%, #162447 65%, #0d1326 100%);
  box-shadow:0 12px 0 #19324d, 0 24px 48px rgba(13,19,38,.45);
  overflow:hidden;
  color:#fff;
}
.start-screen:before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0px, rgba(255,255,255,.03) 2px, transparent 2px, transparent 4px);
  pointer-events:none;
  z-index:1;
}
.start-badge{
  position:relative;
  z-index:3;
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  padding:.35rem .9rem;
  border:2px solid #ffcb05;
  border-radius:99px;
  background:rgba(25,50,77,.85);
  color:#ffcb05;
  font:400 .65rem "Press Start 2P", monospace;
  letter-spacing:.08em;
  margin-bottom:1rem;
  box-shadow:0 4px 0 #0d1326;
}
.start-title{
  position:relative;
  z-index:3;
  font:400 clamp(1.5rem, 4.5vw, 2.5rem)/1.35 "Press Start 2P", monospace;
  color:#ffcb05;
  text-shadow:4px 4px 0 #2a75bb, 7px 7px 0 #0d1326;
  margin-bottom:.6rem;
  animation:titleFloat 2.8s ease-in-out infinite;
}
@keyframes titleFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.start-sub{
  position:relative;
  z-index:3;
  max-width:540px;
  color:#cde4ff;
  font-size:1.1rem;
  margin:0 auto 1.2rem;
}

/* PENTAS ANIMASI PERTARUNGAN PIKACHU */
.battle-stage{
  position:relative;
  z-index:3;
  width:100%;
  max-width:660px;
  height:235px;
  margin:.5rem auto 1.6rem;
  border:4px solid #19324d;
  border-radius:22px;
  background:linear-gradient(180deg, #1b2845 0%, #274060 58%, #3c8d40 58%, #28662e 100%);
  box-shadow:inset 0 0 30px rgba(0,0,0,.4), 0 8px 0 #0d1326;
  overflow:hidden;
  animation:stageShake 3.4s infinite;
}
@keyframes stageShake{
  0%, 42%, 65%, 100%{transform:translate(0,0)}
  45%{transform:translate(-6px, 4px)}
  48%{transform:translate(6px, -4px)}
  51%{transform:translate(-5px, -3px)}
  54%{transform:translate(5px, 3px)}
  57%{transform:translate(-3px, 2px)}
}
.stage-flash{
  position:absolute;
  inset:0;
  background:#fffbe0;
  opacity:0;
  pointer-events:none;
  z-index:5;
  animation:thunderFlash 3.4s infinite;
}
@keyframes thunderFlash{
  0%, 41%, 52%, 100%{opacity:0}
  43%{opacity:.75}
  46%{opacity:.15}
  48%{opacity:.6}
}
.stage-platform{
  position:absolute;
  bottom:22px;
  width:140px;
  height:32px;
  border-radius:50%;
  background:rgba(13,19,38,.45);
  border:3px solid rgba(255,255,255,.18);
}
.plat-left{left:8%}
.plat-right{right:8%}

.hero-pikachu{
  position:absolute;
  left:9%;
  bottom:26px;
  width:130px;
  height:130px;
  z-index:4;
  animation:pikaAttackCycle 3.4s infinite;
}
.hero-pikachu img{
  width:100%;
  height:100%;
  image-rendering:pixelated;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));
}
@keyframes pikaAttackCycle{
  0%, 15%{transform:translateX(0) scale(1)}
  25%{transform:translateX(-12px) scale(1.08, .92)}
  35%{transform:translateY(-28px) translateX(18px) scale(1.12)}
  45%{transform:translateY(0) translateX(12px) scale(1.05)}
  65%, 100%{transform:translateX(0) scale(1)}
}
.electric-aura{
  position:absolute;
  inset:-15px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,235,59,.85) 0%, rgba(255,193,7,.35) 50%, transparent 72%);
  opacity:0;
  animation:auraCharge 3.4s infinite;
}
@keyframes auraCharge{
  0%, 15%, 55%, 100%{opacity:0;transform:scale(.6)}
  30%, 45%{opacity:1;transform:scale(1.25)}
}

/* PANAHAN PETIR SVG */
.lightning-beam{
  position:absolute;
  left:24%;
  top:26%;
  width:52%;
  height:110px;
  z-index:4;
  opacity:0;
  transform-origin:left center;
  animation:boltShoot 3.4s infinite;
}
@keyframes boltShoot{
  0%, 36%{opacity:0;transform:scaleX(0)}
  40%{opacity:1;transform:scaleX(1)}
  54%{opacity:1;transform:scaleX(1)}
  62%, 100%{opacity:0;transform:scaleX(1)}
}

.target-dummy{
  position:absolute;
  right:10%;
  bottom:30px;
  width:115px;
  height:115px;
  z-index:3;
  animation:dummyHit 3.4s infinite;
}
.target-dummy img{
  width:100%;
  height:100%;
  image-rendering:pixelated;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));
}
@keyframes dummyHit{
  0%, 40%{transform:translateX(0) filter:brightness(1)}
  43%{transform:translateX(14px) rotate(8deg);filter:brightness(2.5) sepia(1) hue-rotate(15deg)}
  48%{transform:translateX(-10px) rotate(-6deg);filter:brightness(2)}
  53%{transform:translateX(8px);filter:brightness(1.5)}
  65%, 100%{transform:translateX(0) rotate(0);filter:brightness(1)}
}
.attack-label{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  background:#ffcb05;
  color:#19324d;
  border:3px solid #19324d;
  border-radius:10px;
  padding:.25rem .75rem;
  font:400 .65rem "Press Start 2P", monospace;
  z-index:6;
  opacity:0;
  white-space:nowrap;
  animation:labelPop 3.4s infinite;
}
@keyframes labelPop{
  0%, 34%{opacity:0;transform:translate(-50%, 8px) scale(.8)}
  39%, 56%{opacity:1;transform:translate(-50%, 0) scale(1)}
  64%, 100%{opacity:0;transform:translate(-50%, -6px)}
}
.spark-burst{
  position:absolute;
  right:13%;
  top:28%;
  font-size:2rem;
  z-index:6;
  opacity:0;
  animation:burstPop 3.4s infinite;
}
@keyframes burstPop{
  0%, 40%, 60%, 100%{opacity:0;transform:scale(.4) rotate(0deg)}
  46%{opacity:1;transform:scale(1.35) rotate(25deg)}
}

/* BUTANG MULA UTAMA */
.btn-start-game{
  position:relative;
  z-index:4;
  display:inline-flex;
  align-items:center;
  gap:.8rem;
  padding:1rem 2.4rem;
  font:400 1.25rem "Press Start 2P", monospace;
  color:#19324d;
  background:linear-gradient(180deg, #ffe347 0%, #ffcb05 55%, #f2a900 100%);
  border:4px solid #19324d;
  border-radius:18px;
  box-shadow:0 8px 0 #19324d, 0 0 25px rgba(255,203,5,.65);
  animation:pulseBtn 1.5s ease-in-out infinite;
}
.btn-start-game:hover{
  transform:translateY(-4px) scale(1.03);
  box-shadow:0 12px 0 #19324d, 0 0 35px rgba(255,203,5,.95);
}
.btn-start-game:active{
  transform:translateY(5px);
  box-shadow:0 3px 0 #19324d;
}
@keyframes pulseBtn{
  0%,100%{box-shadow:0 8px 0 #19324d, 0 0 18px rgba(255,203,5,.5)}
  50%{box-shadow:0 8px 0 #19324d, 0 0 36px rgba(255,203,5,.95)}
}
.start-hint{
  position:relative;
  z-index:3;
  margin-top:1rem;
  font:400 .65rem "Press Start 2P", monospace;
  color:#90b4de;
  letter-spacing:.06em;
  animation:blinkText 1.2s step-end infinite;
}
@keyframes blinkText{50%{opacity:.35}}

/* ==================== BANNER & PERANAN ==================== */
.world-banner{position:relative;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;min-height:255px;margin:1.25rem 0 1.4rem;padding:1.25rem 1.5rem;border:4px solid #244764;border-radius:26px;overflow:hidden;background:linear-gradient(115deg,#fff8d9 0%,#fff 49%,#c8f0ff 100%);box-shadow:0 8px 0 #24476433,0 18px 34px #17476a20}
.world-banner:before{content:"";position:absolute;left:-7%;right:-5%;bottom:-60px;height:125px;border-radius:50% 50% 0 0;background:linear-gradient(#85d77c,#4cae63);transform:rotate(-3deg)}
.world-banner:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-linear-gradient(90deg,#4cae63 0 18px,#70c96c 18px 36px)}
.world-copy{position:relative;z-index:2;max-width:470px}.world-kicker{display:inline-block;padding:.25rem .6rem;border-radius:99px;background:#2a75bb;color:#fff;font-size:.72rem;font-weight:900;letter-spacing:.1em}
.world-copy h2{font-size:clamp(1.35rem,3.3vw,2.15rem);line-height:1.15;margin:.7rem 0;color:#1c4666}.world-copy p{max-width:430px;margin:.4rem 0 .8rem;color:#4e6372}
.world-stats{display:flex;flex-wrap:wrap;gap:.4rem}.world-stats span{font-size:.78rem;font-weight:800;background:#fff;border:2px solid #c4d9e4;border-radius:30px;padding:.2rem .55rem}
.world-characters{position:relative;z-index:2;min-height:210px;display:flex;align-items:flex-end;justify-content:center}

let AC;
function bip(f,d){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),
    g=AC.createGain();
    o.type="square";
    o.frequency.value=f;
    g.gain.value=.05;
    o.connect(g);
    g.connect(AC.destination);
    o.start();
    o.stop(AC.currentTime+(d||.12))
  }catch(e){}
}

function pokemon(id,w,label){
 const size=w||100;
 const found=POKEDEX.find(p=>p.id===id);
 const name=label||(found?found.name:"Pokémon");
 return `<img class="pokemon-sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png" alt="${esc(name)}" width="${size}" height="${size}" loading="lazy" decoding="async">`;
}

function mon(c,k,w){
 const p=POKEDEX[k]||POKEDEX[0];
 return pokemon(p.id,w,p.name);
}

const monOf=l=>l.mon||{n:"Pikachu",c:"#ffcf33",k:0};
const need=L=>Math.ceil(L.q.length*2/3);
const lessonObj=()=>LESSONS.find(l=>l.id===lesson);

 const me=db.students.find(s=>s.id===S.id);if(!me){setTimeout(logout);return ""}

function lessonView(){

 if(B.ph==="learn")return `<button class="ghost" onclick="closeL()">${TEKS.kembali}</button>
 <div class="card center" style="margin-top:1rem"><div class="mon float" style="width:130px;margin:0 auto">${mon(m.c,m.k,130)}</div><h2>${esc(m.n)} ${TEKS.liarMuncul}</h2><span class="tag">${esc(L.title)}</span>

 if(B.ph==="end"){const won=B.ok>=need(L);

  (won?`<div class="capt"><div class="orb"></div><div class="mon">${mm}</div><span class="spark" style="left:18%;top:10%">✨</span><span class="spark" style="right:18%;top:20%">⭐</span></div><p><b>${TEKS.berjaya}</b></p>`

  `<button onclick="closeL()">${TEKS.kembaliSenarai}</button></div>`}
 const q=L.q[B.q],fb=B.fb,hp=Math.round((1-B.ok/L.q.length)*100);

 <div class="arena-hills"></div><img class="arena-deco arena-deco-left" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png" alt="Squirtle" loading="lazy">

 <div class="plate en"><b>${esc(m.n)}</b> <small>HP</small><div class="bar hp${hp<40?" low":""}"><i style="width:${hp}%"></i></div></div>
 <div class="enemy"><div class="${fb&&fb.right?"hit":""}">${mm}</div>${fb&&fb.right?`<span class="dmg">-${Math.round(100/L.q.length)}</span>`:""}</div>
 <div class="trainer"><span class="trainer-cap">🧢</span><span class="trainer-word">JURULATIH</span><span class="trainer-pokemon">${pokemon(25,58,"Pikachu")}</span></div><div class="plate me">${"❤️".repeat(B.hp)}${"🖤".repeat(3-B.hp)}</div></div>
 <div class="card"><span class="tag">${TEKS.soalan} ${B.q+1}/${L.q.length}</span><h2 style="margin-top:.5rem">${esc(q.q)}</h2>
 <div class="opts${fb?" lock":""}">`+q.o.map((o,j)=>`<button class="${fb?(j===q.a?"ok":j===fb.j?"no":"dim"):""}" onclick="answer(${j})">${esc(o)}</button>`).join("")+`</div></div>`;
}

function startB(){bip(520);B.ph="fight";render()}
function answer(j){
 if(!B||B.fb)return;const L=lessonObj(),q=L.q[B.q],right=j===q.a;
 B.fb={j,right};if(right){B.ok++;bip(880,.15)}else{B.hp--;bip(150,.25)}
 render();
 setTimeout(()=>{if(!B)return;B.fb=null;B.q++;if(B.q>=L.q.length||B.hp<=0)finishB();else render()},900);
}
function finishB(){
 const L=lessonObj(),me=db.students.find(s=>s.id===S.id),old=me.p[L.id];
 if(!old||B.ok>old.s)me.p[L.id]={s:B.ok,t:L.q.length};
 save();B.ph="end";render();window.scrollTo(0,0);
}

/* AKTIVITI POKÉMON LATAR */
const BG_POKEMON_ACTIVITY = {
  "bg-pikachu": { message: "Pikachu menggunakan Thunder Shock! ⚡", className: "activity-bounce", sound: 880 },
  "bg-jigglypuff": { message: "Jigglypuff menyanyi untuk anda! 🎵", className: "activity-spin", sound: 660 },
  "bg-eevee": { message: "Eevee sedang bergembira! ✨", className: "activity-wiggle", sound: 520 }
};

function showPokemonBubble(element, message) {
  const oldBubble = document.querySelector(".pokemon-bubble");
  if (oldBubble) oldBubble.remove();
  const bubble = document.createElement("div");
  bubble.className = "pokemon-bubble";
  bubble.textContent = message;
  document.body.appendChild(bubble);
  const rect = element.getBoundingClientRect();
  const bubbleWidth = 220;
  let left = Math.max(8, Math.min(rect.left + rect.width / 2 - bubbleWidth / 2, window.innerWidth - bubbleWidth - 8));
  let top = Math.max(8, rect.top - 60);
  bubble.style.left = `${left}px`;
  bubble.style.top = `${top}px`;
  setTimeout(() => bubble.remove(), 2300);
}

function createPokemonSparks(element) {
  const rect = element.getBoundingClientRect();
  const symbols = ["✦", "✧", "⚡", "★", "✨"];
  for (let i = 0; i < 5; i++) {
    const spark = document.createElement("span");
    spark.className = "pokemon-spark";
    spark.textContent = symbols[i % symbols.length];
    spark.style.left = `${rect.left + rect.width / 2}px`;
    spark.style.top = `${rect.top + rect.height / 2}px`;
    spark.style.setProperty("--spark-x", `${(Math.random() - .5) * 130}px`);
    spark.style.setProperty("--spark-y", `${-30 - Math.random() * 90}px`);
    document.body.appendChild(spark);
    setTimeout(() => spark.remove(), 900);
  }
}

function activateBackgroundPokemon(element) {
  const activity = BG_POKEMON_ACTIVITY[element.id];
  if (!activity) return;
  element.classList.remove("activity-bounce", "activity-spin", "activity-wiggle");
  void element.offsetWidth;
  element.classList.add(activity.className);
  showPokemonBubble(element, activity.message);
  createPokemonSparks(element);
  if (typeof bip === "function") bip(activity.sound, .14);
  setTimeout(() => element.classList.remove(activity.className), 950);
}

function setupBackgroundPokemon() {
  document.querySelectorAll(".bg-pokemon").forEach(element => {
    element.addEventListener("click", event => {
      event.preventDefault();
      event.stopPropagation();
      activateBackgroundPokemon(element);
    });
    element.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        event.stopPropagation();
        activateBackgroundPokemon(element);
      }
    });
  });
}

seedDemo();
