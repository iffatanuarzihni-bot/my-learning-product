<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Academy | Dunia Pembelajaran 8-Bit</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ==================== SISTEM REKA BENTUK POKÉMON RPG ==================== */
:root{
  --ink:#101c36;
  --navy:#192b4d;
  --paper:#fffdf4;
  --panel:#f3f7ff;
  --pri:#2c6bed;
  --gold:#ffcb05;
  --gold-dark:#e0a800;
  --grn:#35c46a;
  --red:#ef3e4a;
  --mut:#5d6c89;
  --sky-top:#0d1630;
  --sky-mid:#1a2f5a;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font:600 16px/1.5 "Baloo 2",system-ui,sans-serif;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,203,5,.14), transparent 38%),
    radial-gradient(circle at 80% 15%, rgba(44,107,237,.22), transparent 40%),
    linear-gradient(180deg, #101b38 0%, #1c3566 48%, #24578a 100%) fixed;
  overflow-x:hidden;
}

/* Corak grid retro halus */
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 25px 35px,#fff,transparent),
    radial-gradient(2px 2px at 140px 85px,#ffe57f,transparent),
    radial-gradient(1.5px 1.5px at 80px 160px,#90caf9,transparent),
    radial-gradient(2px 2px at 210px 45px,#fff,transparent);
  background-size:240px 200px;
  opacity:.55;
  animation:twinkle 3s ease-in-out infinite alternate;
  z-index:0;
}
@keyframes twinkle{to{opacity:.2}}

.wrap{
  position:relative;
  z-index:2;
  max-width:980px;
  margin:0 auto;
  padding:1.2rem 1rem 3.5rem;
  animation:pop .32s ease-out;
  pointer-events:none;
}
.wrap>*{pointer-events:auto}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}

/* Bar Kawalan Audio Terapung */
.audio-dock{
  position:fixed;
  top:14px;
  right:14px;
  z-index:50;
  display:flex;
  gap:.45rem;
}
.audio-btn{
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  padding:.45rem .8rem;
  font:400 .62rem "Press Start 2P",monospace;
  border:3px solid var(--ink);
  border-radius:12px;
  background:var(--paper);
  color:var(--ink);
  box-shadow:0 4px 0 var(--ink);
  cursor:pointer;
}
.audio-btn.on{
  background:var(--gold);
}
.audio-btn:hover{transform:translateY(-2px)}
.audio-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* Tipografi & Elemen Asas */
h1,h2{margin:0 0 .5rem;line-height:1.3}
h1{
  font:400 1.2rem/1.55 "Press Start 2P",monospace;
  color:var(--gold);
  text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
}
h1.logo{
  font-size:clamp(1.25rem,3.6vw,2rem);
  text-align:center;
  text-shadow:3px 3px 0 #1f4ca8, 5px 5px 0 var(--ink);
  animation:glowTitle 2.2s ease-in-out infinite alternate;
}
@keyframes glowTitle{to{transform:scale(1.03)}}
h2{font-size:1.3rem;font-weight:800;color:var(--navy)}
.sub{color:#dce9ff;text-align:center;margin:.2rem 0 1.1rem;font-size:1.05rem}
.mut{color:var(--mut)}
.top .mut{color:#cfe0ff}

/* Butang Gaya Konsol */
button{
  font:inherit;
  font-weight:800;
  cursor:pointer;
  border:3px solid var(--ink);
  border-radius:14px;
  padding:.58rem 1.05rem;
  background:linear-gradient(180deg,#ffe054,var(--gold));
  color:var(--ink);
  box-shadow:0 5px 0 var(--ink);
  transition:transform .1s,box-shadow .1s,filter .15s;
}
button:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink);filter:brightness(1.04)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button.ghost{background:#fff;color:var(--navy)}
button.danger{background:var(--red);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

input{
  font:inherit;
  padding:.58rem .75rem;
  border:3px solid var(--ink);
  border-radius:12px;
  width:100%;
  background:#fff;
  color:var(--ink);
}
label{display:block;font-weight:800;font-size:.9rem;margin-bottom:.2rem;color:var(--navy)}

/* Kad RPG / Pokédex */
.card{
  position:relative;
  background:var(--paper);
  border:4px solid var(--ink);
  border-radius:22px;
  padding:1.2rem;
  margin-bottom:1.25rem;
  box-shadow:0 8px 0 rgba(10,18,38,.45), inset 0 0 0 3px #e8eefc;
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:.85rem;align-items:end}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}

.tag{
  display:inline-block;
  padding:.08rem .65rem;
  border:2px solid var(--ink);
  border-radius:99px;
  font-size:.78rem;
  font-weight:800;
  background:#dce8ff;
  color:var(--navy);
}
.tag.ok{background:#c5f7d5;color:#11572b}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.55rem .45rem;border-bottom:2px dashed #d3dced;vertical-align:middle}
th{font-size:.82rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}

.bar{
  height:17px;
  background:#dce4f2;
  border:3px solid var(--ink);
  border-radius:99px;
  overflow:hidden;
  min-width:95px;
}
.bar i{display:block;height:100%;background:linear-gradient(#5cf297,#22b862);transition:width .55s ease}
.xp i{background:linear-gradient(#ffe36e,#f5a600)}
.hp.mid i{background:linear-gradient(#ffe066,#f7b500)}
.hp.low i{background:linear-gradient(#ff8fa3,#ef3e4a)}

.err{
  background:#ffe2e6;
  color:#9c142a;
  border:3px solid var(--ink);
  padding:.65rem .9rem;
  border-radius:14px;
  margin-bottom:1rem;
  font-weight:800;
}
.q{margin:1rem 0}

/* Sprite Pokémon */
.mon{display:flex;align-items:center;justify-content:center;flex:none}
.mon img,.pokemon-sprite{
  display:block;
  max-width:100%;
  height:auto;
  object-fit:contain;
  image-rendering:pixelated;
  filter:drop-shadow(0 6px 2px rgba(16,28,54,.28));
}
.sil img{filter:brightness(0) opacity(.35)}
.float{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}

/* ==================== SKRIN MULA (PIKACHU THUNDERBOLT SHOWCASE) ==================== */
.start-screen{
  position:relative;
  min-height:84vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:2.2rem 1.4rem 2.3rem;
  border:5px solid var(--ink);
  border-radius:30px;
  background:
    radial-gradient(circle at 50% 25%, #2b4e94 0%, #162852 55%, #0c142b 100%);
  box-shadow:0 12px 0 var(--ink), 0 25px 50px rgba(0,0,0,.55);
  overflow:hidden;
  color:#fff;
}
/* Garisan scanline CRT halus */
.start-screen:before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px);
  pointer-events:none;
  z-index:1;
}
.start-grid-floor{
  position:absolute;
  left:-20%;
  right:-20%;
  bottom:-45px;
  height:180px;
  background:
    linear-gradient(transparent 0%, rgba(44,107,237,.35) 100%),
    repeating-linear-gradient(90deg, rgba(255,203,5,.15) 0 2px, transparent 2px 48px),
    repeating-linear-gradient(0deg, rgba(255,203,5,.15) 0 2px, transparent 2px 32px);
  transform:perspective(220px) rotateX(55deg);
  pointer-events:none;
  z-index:1;
}

.start-badge{
  position:relative;
  z-index:3;
  display:inline-flex;
  align-items:center;
  gap:.5rem;
  padding:.38rem .95rem;
  border:2px solid var(--gold);
  border-radius:99px;
  background:rgba(16,28,54,.85);
  color:var(--gold);
  font:400 .62rem "Press Start 2P",monospace;
  letter-spacing:.08em;
  margin-bottom:.95rem;
  box-shadow:0 4px 0 #091020;
}

.start-title{
  position:relative;
  z-index:3;
  font:400 clamp(1.45rem,4.6vw,2.6rem)/1.35 "Press Start 2P",monospace;
  color:var(--gold);
  text-shadow:4px 4px 0 #2157c2, 7px 7px 0 #091020;
  margin:0 0 .55rem;
  animation:titleFloat 2.8s ease-in-out infinite;
}
@keyframes titleFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.start-sub{
  position:relative;
  z-index:3;
  max-width:580px;
  color:#d7e7ff;
  font-size:1.08rem;
  margin:0 auto 1.2rem;
}

/* PENTAS ANIMASI PERTARUNGAN EPIK */
.battle-stage{
  position:relative;
  z-index:3;
  width:100%;
  max-width:720px;
  height:265px;
  margin:.4rem auto 1.65rem;
  border:4px solid var(--ink);
  border-radius:24px;
  background:
    radial-gradient(circle at 22% 55%, rgba(255,220,50,.18), transparent 45%),
    linear-gradient(180deg, #1b2f61 0%, #2b4c8c 54%, #3c9b52 54%, #256e38 100%);
  box-shadow:inset 0 0 32px rgba(0,0,0,.45), 0 9px 0 #091020;
  overflow:hidden;
  animation:stageShake 3.6s infinite;
}
@keyframes stageShake{
  0%, 40%, 66%, 100%{transform:translate(0,0)}
  43%{transform:translate(-7px, 5px)}
  46%{transform:translate(7px, -5px)}
  49%{transform:translate(-6px, -4px)}
  52%{transform:translate(6px, 4px)}
  55%{transform:translate(-4px, 2px)}
}

/* Awan & bintang arena mula */
.stage-cloud{
  position:absolute;
  top:14%;
  font-size:1.7rem;
  opacity:.35;
  animation:driftSlow 18s linear infinite;
}
.stage-cloud.c2{top:27%;font-size:1.25rem;animation-delay:-9s}
@keyframes driftSlow{from{left:-12%}to{left:108%}}

/* HUD mini dalam pentas animasi */
.stage-hud{
  position:absolute;
  padding:.35rem .6rem;
  background:rgba(255,253,244,.94);
  color:var(--ink);
  border:3px solid var(--ink);
  border-radius:10px;
  font:400 .55rem "Press Start 2P",monospace;
  z-index:6;
  text-align:left;
  box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.stage-hud.hero{left:14px;top:12px}
.stage-hud.foe{right:14px;top:12px;min-width:165px}
.mini-hp{
  height:8px;
  margin-top:5px;
  border:2px solid var(--ink);
  border-radius:99px;
  background:#d8e0ef;
  overflow:hidden;
}
.mini-hp i{display:block;height:100%;background:#35c46a}
.foe-hp-bar{
  animation:foeHpDrop 3.6s infinite;
}
@keyframes foeHpDrop{
  0%, 40%{width:100%;background:#35c46a}
  48%, 78%{width:18%;background:#ef3e4a}
  92%, 100%{width:100%;background:#35c46a}
}

.stage-flash{
  position:absolute;
  inset:0;
  background:#fffbe0;
  opacity:0;
  pointer-events:none;
  z-index:7;
  animation:thunderFlash 3.6s infinite;
}
@keyframes thunderFlash{
  0%, 39%, 55%, 100%{opacity:0}
  41%{opacity:.82}
  44%{opacity:.15}
  47%{opacity:.65}
}

.stage-platform{
  position:absolute;
  bottom:24px;
  width:155px;
  height:36px;
  border-radius:50%;
  background:radial-gradient(ellipse, rgba(16,28,54,.65), rgba(16,28,54,.25));
  border:3px solid rgba(255,255,255,.22);
}
.plat-left{left:7%}
.plat-right{right:7%}

/* Pikachu Hero */
.hero-pikachu{
  position:absolute;
  left:9%;
  bottom:30px;
  width:132px;
  height:132px;
  z-index:4;
  animation:pikaAttackCycle 3.6s infinite;
}
.hero-pikachu img{
  width:100%;
  height:100%;
  image-rendering:pixelated;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));
}
@keyframes pikaAttackCycle{
  0%, 14%{transform:translateX(0) scale(1)}
  24%{transform:translateX(-14px) scale(1.1, .9)}
  34%{transform:translateY(-30px) translateX(22px) scale(1.14)}
  44%{transform:translateY(0) translateX(14px) scale(1.06)}
  68%, 100%{transform:translateX(0) scale(1)}
}
.electric-aura{
  position:absolute;
  inset:-18px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,235,59,.9) 0%, rgba(255,193,7,.4) 48%, transparent 72%);
  opacity:0;
  animation:auraCharge 3.6s infinite;
}
@keyframes auraCharge{
  0%, 14%, 56%, 100%{opacity:0;transform:scale(.55)}
  28%, 44%{opacity:1;transform:scale(1.3)}
}
.charge-ring{
  position:absolute;
  inset:-24px;
  border:4px dashed #ffeb3b;
  border-radius:50%;
  opacity:0;
  animation:ringSpin 3.6s infinite;
}
@keyframes ringSpin{
  0%, 16%, 52%, 100%{opacity:0;transform:rotate(0deg) scale(.6)}
  30%, 44%{opacity:.95;transform:rotate(180deg) scale(1.15)}
}

/* Panahan Petir Ganda SVG */
.lightning-beam{
  position:absolute;
  left:23%;
  top:27%;
  width:54%;
  height:120px;
  z-index:5;
  opacity:0;
  transform-origin:left center;
  animation:boltShoot 3.6s infinite;
}
@keyframes boltShoot{
  0%, 35%{opacity:0;transform:scaleX(0)}
  39%{opacity:1;transform:scaleX(1)}
  54%{opacity:1;transform:scaleX(1)}
  62%, 100%{opacity:0;transform:scaleX(1)}
}

.target-dummy{
  position:absolute;
  right:9%;
  bottom:32px;
  width:120px;
  height:120px;
  z-index:4;
  animation:dummyHit 3.6s infinite;
}
.target-dummy img{
  width:100%;
  height:100%;
  image-rendering:pixelated;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.45));
}
@keyframes dummyHit{
  0%, 39%{transform:translateX(0);filter:brightness(1)}
  42%{transform:translateX(16px) rotate(9deg);filter:brightness(2.8) sepia(1) hue-rotate(15deg)}
  47%{transform:translateX(-11px) rotate(-7deg);filter:brightness(2.2)}
  52%{transform:translateX(9px);filter:brightness(1.6)}
  66%, 100%{transform:translateX(0) rotate(0);filter:brightness(1)}
}

.attack-label{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  background:var(--gold);
  color:var(--ink);
  border:3px solid var(--ink);
  border-radius:12px;
  padding:.32rem .85rem;
  font:400 .62rem "Press Start 2P",monospace;
  z-index:8;
  opacity:0;
  white-space:nowrap;
  box-shadow:0 4px 0 var(--ink);
  animation:labelPop 3.6s infinite;
}
@keyframes labelPop{
  0%, 32%{opacity:0;transform:translate(-50%, 10px) scale(.85)}
  38%, 58%{opacity:1;transform:translate(-50%, 0) scale(1)}
  66%, 100%{opacity:0;transform:translate(-50%, -6px)}
}

.spark-burst{
  position:absolute;
  right:12%;
  top:26%;
  font-size:2.1rem;
  z-index:8;
  opacity:0;
  animation:burstPop 3.6s infinite;
}
@keyframes burstPop{
  0%, 39%, 62%, 100%{opacity:0;transform:scale(.4) rotate(0deg)}
  45%{opacity:1;transform:scale(1.4) rotate(25deg)}
}
.crit-dmg{
  position:absolute;
  right:15%;
  top:22%;
  font:400 .95rem "Press Start 2P",monospace;
  color:#ffeb3b;
  text-shadow:3px 3px 0 #ef3e4a, -2px -2px 0 var(--ink);
  z-index:8;
  opacity:0;
  animation:critPop 3.6s infinite;
}
@keyframes critPop{
  0%, 40%{opacity:0;transform:translateY(10px) scale(.6)}
  46%{opacity:1;transform:translateY(-16px) scale(1.15)}
  62%{opacity:1;transform:translateY(-30px) scale(1)}
  70%, 100%{opacity:0;transform:translateY(-40px)}
}

/* Butang MULA Utama */
.btn-start-game{
  position:relative;
  z-index:4;
  display:inline-flex;
  align-items:center;
  gap:.85rem;
  padding:1.05rem 2.6rem;
  font:400 1.25rem "Press Start 2P",monospace;
  color:var(--ink);
  background:linear-gradient(180deg, #ffe85e 0%, #ffcb05 55%, #f0a500 100%);
  border:4px solid var(--ink);
  border-radius:18px;
  box-shadow:0 8px 0 var(--ink), 0 0 28px rgba(255,203,5,.65);
  animation:pulseBtn 1.5s ease-in-out infinite;
}
.btn-start-game:hover{
  transform:translateY(-4px) scale(1.04);
  box-shadow:0 12px 0 var(--ink), 0 0 40px rgba(255,203,5,.95);
}
.btn-start-game:active{
  transform:translateY(5px);
  box-shadow:0 3px 0 var(--ink);
}
@keyframes pulseBtn{
  0%,100%{box-shadow:0 8px 0 var(--ink), 0 0 18px rgba(255,203,5,.55)}
  50%{box-shadow:0 8px 0 var(--ink), 0 0 38px rgba(255,203,5,.95)}
}
.start-hint{
  position:relative;
  z-index:3;
  margin-top:1.05rem;
  font:400 .6rem "Press Start 2P",monospace;
  color:#9fc0ff;
  letter-spacing:.06em;
  animation:blinkText 1.2s step-end infinite;
}
@keyframes blinkText{50%{opacity:.3}}

/* ==================== HUB PILIHAN PERANAN ==================== */
.hub-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:.9rem;
  gap:.6rem;
  flex-wrap:wrap;
}
.world-banner{
  position:relative;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  align-items:center;
  min-height:240px;
  margin:1rem 0 1.4rem;
  padding:1.35rem 1.6rem;
  border:4px solid var(--ink);
  border-radius:26px;
  overflow:hidden;
  background:linear-gradient(125deg,#fff8d6 0%,#ffffff 52%,#cce8ff 100%);
  box-shadow:0 9px 0 rgba(10,18,38,.45);
}
.world-banner:before{
  content:"";
  position:absolute;
  left:-6%;
  right:-6%;
  bottom:-58px;
  height:122px;
  border-radius:50% 50% 0 0;
  background:linear-gradient(#6ed676,#3ea859);
  border-top:4px solid var(--ink);
  transform:rotate(-2deg);
}
.world-copy{position:relative;z-index:2;max-width:480px}
.world-kicker{
  display:inline-block;
  padding:.26rem .7rem;
  border:2px solid var(--ink);
  border-radius:99px;
  background:var(--pri);
  color:#fff;
  font:400 .58rem "Press Start 2P",monospace;
}
.world-copy h2{font-size:clamp(1.35rem,3.2vw,2.05rem);line-height:1.18;margin:.7rem 0 .4rem;color:var(--ink)}
.world-copy p{max-width:430px;margin:.3rem 0 .85rem;color:#3c4f6e}
.world-stats{display:flex;flex-wrap:wrap;gap:.45rem}
.world-stats span{
  font-size:.8rem;
  font-weight:800;
  background:#fff;
  border:2px solid var(--ink);
  border-radius:99px;
  padding:.2rem .65rem;
}
.world-characters{
  position:relative;
  z-index:2;
  min-height:195px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}
.world-poke{position:absolute;display:grid;place-items:center}
.world-eevee{left:6%;bottom:20px;animation:bob 3.2s ease-in-out infinite}
.world-pikachu{z-index:2;left:32%;bottom:12px;animation:bob 2.2s ease-in-out infinite}
.world-bulba{right:2%;bottom:16px;animation:bob 2.9s ease-in-out infinite reverse}

.section-heading{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:.65rem;
  margin:1.2rem 0 .85rem;
  color:#fff;
}
.section-heading h2{
  margin:0;
  font:400 1rem "Press Start 2P",monospace;
  color:var(--gold);
  text-shadow:2px 2px 0 var(--ink);
}
.section-heading span{font-size:1.4rem}

.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin:0 0 1.4rem}
.role{
  position:relative;
  min-height:175px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:.35rem;
  text-align:center;
  padding:1.15rem .85rem;
  background:var(--paper);
  border:4px solid var(--ink);
  border-radius:22px;
  box-shadow:0 8px 0 var(--ink);
  transition:transform .16s,box-shadow .16s;
}
.role:hover{transform:translateY(-6px);box-shadow:0 12px 0 var(--ink)}
.role:hover .mon{animation:jump .48s}
@keyframes jump{40%{transform:translateY(-14px) scale(1.1)}}
.role .mon{width:90px;height:90px}
.role strong{font-size:1.3rem;color:var(--ink)}
.role .mut{font-size:.86rem;line-height:1.3}
.role-arrow{
  position:absolute;
  right:12px;
  top:12px;
  width:28px;
  height:28px;
  display:grid;
  place-items:center;
  border:2px solid var(--ink);
  border-radius:50%;
  background:var(--gold);

/* =====================================================================
   0) ENJIN MUZIK 8-BIT & KESAN BUNYI (WEB AUDIO API CHIPTUNE)
   ===================================================================== */
const Chiptune = (() => {
  let ctx = null;
  let enabled = false;
  let currentTrack = "menu";
  let step = 0;
  let timer = null;
  let noiseBuf = null;

  // Frekuensi not muzik (Hz)
  const N = {
    _:0,
    C3:130.81, D3:146.83, E3:164.81, F3:174.61, G3:196.00, A3:220.00, B3:246.94,
    C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, Gs4:415.30, A4:440.00, Bb4:466.16, B4:493.88,
    C5:523.25, D5:587.33, Eb5:622.25, E5:659.25, F5:698.46, Fs5:739.99, G5:783.99, Gs5:830.61, A5:880.00, B5:987.77, C6:1046.50
  };

  // Lagu 1: Tema Pengembaraan 8-Bit (Ceria ala Bandar Pokémon)
  const MENU_TRACK = {
    tempoMs: 145,
    lead: [
      "E5","G5","C6","G5","E5","G5","A5","G5",
      "F5","A5","G5","E5","D5","E5","F5","D5",
      "E5","G5","C6","G5","A5","B5","C6","G5",
      "F5","E5","D5","G5","C5","_","G4","_"
    ],
    bass: [
      "C3","G3","C3","G3","A3","E3","A3","E3",
      "F3","C3","G3","D3","G3","D3","G3","B3",
      "C3","G3","C3","G3","F3","C3","E3","C3",
      "D3","G3","G3","G3","C3","G3","C3","_"
    ]
  };

  // Lagu 2: Tema Pertarungan 8-Bit (Laju & Mendebarkan)
  const BATTLE_TRACK = {
    tempoMs: 112,
    lead: [
      "E5","Eb5","E5","Eb5","E5","G5","Fs5","E5",
      "D5","F5","E5","D5","C5","E5","D5","B4",
      "E5","G5","A5","G5","Fs5","E5","D5","E5",
      "F5","G5","Gs5","A5","B5","G5","E5","_"
    ],
    bass: [
      "E3","E3","B3","E3","E3","E3","B3","E3",
      "D3","D3","A3","D3","C3","C3","G3","B3",
      "E3","E3","B3","E3","D3","D3","A3","D3",
      "F3","G3","Gs4","A3","B3","B3","E3","_"
    ]
  };

  function ensureCtx(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      // Buffer bunyi 'noise' untuk dram 8-bit
      const len = ctx.sampleRate * 0.08;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++) data[i] = Math.random()*2 - 1;
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }

  function playTone(freq, dur, type, vol){
    if(!freq || !ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + dur + 0.01);
  }

  function playHitHat(vol){
    if(!ctx || !noiseBuf) return;
    const now = ctx.currentTime;
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    src.connect(gain);
    gain.connect(ctx.destination);
    src.start(now);
  }

  function tick(){
    if(!enabled) return;
    const tr = currentTrack === "battle" ? BATTLE_TRACK : MENU_TRACK;
    const idx = step % tr.lead.length;
    const leadNote = N[tr.lead[idx]];
    const bassNote = N[tr.bass[idx]];
    const dur = tr.tempoMs / 1000 * 0.88;

    if(leadNote) playTone(leadNote, dur, "square", 0.032);
    if(bassNote) playTone(bassNote, dur, "triangle", 0.055);
    if(idx % 2 === 1) playHitHat(currentTrack === "battle" ? 0.024 : 0.014);
    step++;
  }

  function startLoop(){
    stopLoop();
    const tr = currentTrack === "battle" ? BATTLE_TRACK : MENU_TRACK;
    timer = setInterval(tick, tr.tempoMs);
  }

  function stopLoop(){
    if(timer){ clearInterval(timer); timer = null; }
  }

  function updateUI(){
    const btn = document.getElementById("musicBtn");
    if(!btn) return;
    btn.classList.toggle("on", enabled);
    btn.textContent = enabled ? "🎵 Muzik 8-Bit: ON" : "🎵 Muzik: OFF";
  }

  return {
    enable(){
      ensureCtx();
      if(!enabled){
        enabled = true;
        startLoop();
        updateUI();
      }
    },
    toggle(){
      ensureCtx();
      enabled = !enabled;
      if(enabled) startLoop(); else stopLoop();
      updateUI();
    },
    setTrack(name){
      if(currentTrack === name) return;
      currentTrack = name;
      step = 0;
      if(enabled) startLoop();
    },
    sfx(freq, dur=0.12, type="square", vol=0.055){
      const c = ensureCtx();
      if(c) playTone(freq, dur, type, vol);
    },
    fanfare(){
      const c = ensureCtx();
      if(!c) return;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
        setTimeout(() => playTone(f, 0.16, "square", 0.05), i * 110);
      });
    },
    thunder(){
      const c = ensureCtx();
      if(!c) return;
      [980, 740, 1120, 620].forEach((f, i) => {
        setTimeout(() => playTone(f, 0.07, "sawtooth", 0.045), i * 45);
      });
    }
  };
})();

function setS(v){
  S=v;
  if(v) started=true;
  try{v?sessionStorage.setItem("bd_s",JSON.stringify(v)):sessionStorage.removeItem("bd_s")}catch(e){}
  render();
}
const note=()=>msg?`<div class="err" role="alert">${esc(msg)}</div>`:"";

function seedDemo(){
  if(!PAPAR_DEMO||db.demo) return;
  const tid={};
  DEMO.guru.forEach(g=>{
    let t=db.teachers.find(x=>x.u===g[1]);
    if(!t){t={id:uid(),n:g[0],u:g[1],p0:g[2]}; db.teachers.push(t);}
    tid[g[1]]=t.id;
  });
  DEMO.murid.forEach(m=>{
    if(db.students.some(x=>x.u===m[1])) return;
    const p={};
    for(const k in m[5]) p[k]={s:m[5][k][0],t:m[5][k][1]};
    db.students.push({id:uid(),t:tid[m[3]],n:m[0],u:m[1],p0:m[2],c:m[4],p});
  });
  db.demo=1; save();
}

function pokemon(id,w,label){
  const size=w||100;
  const found=POKEDEX.find(p=>p.id===id);
  const name=label||(found?found.name:"Pokémon");
  return `<img class="pokemon-sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png" alt="${esc(name)}" width="${size}" height="${size}" loading="lazy" decoding="async">`;
}
function mon(c,k,w){
  const p=POKEDEX[k]||POKEDEX[0];
  return pokemon(p.id,w,p.name);
}

function topBar(title,sub){
  return `<div class="top">
    <div><h1 style="font-size:1.55rem">${esc(title)}</h1><div class="mut">${esc(sub)}</div></div>
    <button class="ghost" onclick="logout()">${TEKS.logKeluar}</button>
  </div>`;
}

const done=s=>LESSONS.filter(l=>s.p[l.id]&&s.p[l.id].s>=need(l)).length;
const pct=s=>Math.round(done(s)/LESSONS.length*100);
const avg=s=>{let a=0,b=0;LESSONS.forEach(l=>{const r=s.p[l.id];if(r){a+=r.s;b+=r.t}});return b?Math.round(a/b*100)+"%":TEKS.tiadaKuiz};

    <tr>
      <td><b>${esc(t.n)}</b></td>
      <td>${esc(t.u)}</td>

function guruView(){
  const me=db.teachers.find(t=>t.id===S.id); if(!me){setTimeout(logout);return ""}
  const mine=db.students.filter(s=>s.t===me.id);
  const classes=[...new Set(mine.map(s=>s.c))].sort();
  const blocks=classes.map(c=>{
    const rows=mine.filter(s=>s.c===c).map(s=>`
      <tr>
        <td><b>${esc(s.n)}</b></td>
        <td>${esc(s.u)} / ${esc(s.p0)}</td>
        <td><div class="bar" title="${pct(s)}%"><i style="width:${pct(s)}%"></i></div><small class="mut">${done(s)}/${LESSONS.length} ${TEKS.pelajaran}</small></td>
        <td><span class="tag ok">${avg(s)}</span></td>
        <td><button class="ghost" onclick="delS('${s.id}')">${TEKS.buang}</button></td>
      </tr>`).join("");
    return `<div class="card"><h2>🏫 ${TEKS.kelas} ${esc(c)} <span class="tag">${mine.filter(s=>s.c===c).length} ${TEKS.bilMurid}</span></h2>
      <div class="scroll"><table><tr><th>${TEKS.kolNama}</th><th>${TEKS.kolPenggunaKata}</th><th>${TEKS.kolKemajuan}</th><th>${TEKS.kolSkor}</th><th></th></tr>${rows}</table></div></div>`;

  return topBar(TEKS.cikgu+" "+me.n,TEKS.guruSub)+note()+
  `<div class="card"><h2>🎒 ${TEKS.tambahMurid}</h2>
    <form onsubmit="addS(event)" class="grid">
      <div><label for="n">${TEKS.namaPenuh}</label><input id="n" name="n" required></div>

      <div><label for="c">${TEKS.kelas}</label><input id="c" name="c" list="cls" placeholder="${TEKS.contohKelas}" required><datalist id="cls">${classes.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
      <button type="submit">+ ${TEKS.tambahMurid}</button>
    </form>
  </div>`+blocks;
}

const monOf=l=>l.mon||{n:"Pikachu",c:"#ffcf33",k:0};
const need=L=>Math.ceil((L.n||L.q.length)*2/3);
const lessonObj=()=>LESSONS.find(l=>l.id===lesson);

function muridView(){
  const me=db.students.find(s=>s.id===S.id); if(!me){setTimeout(logout);return ""}
  const got=l=>me.p[l.id]&&me.p[l.id].s>=need(l);
  const xp=LESSONS.reduce((a,l)=>a+(me.p[l.id]?me.p[l.id].s*10:0),0), lv=1+Math.floor(xp/30);
  const badges=LESSONS.filter(l=>!l.lock&&got(l)).length, unlocked=badges>=3;
  const strip=LESSONS.map(l=>{const m=monOf(l);return `<div class="mon ${got(l)?"float":"sil"}" title="${esc(m.n)}">${mon(m.c,m.k,46)}</div>`}).join("");
  const cards=LESSONS.map(l=>{
    const p=me.p[l.id], m=monOf(l);
    return `<div class="card stage">
      <div class="mon ${got(l)?"":"sil"}">${mon(m.c,m.k,84)}</div>
      <div class="grow">
        <h2>${esc(l.title)}</h2>
        <span class="tag">${esc(l.subject)}</span>
        ${p?`<span class="tag ok">${TEKS.skorTerbaik} ${p.s}/${p.t}</span>`:""}
        ${got(l)?`<span class="tag ok">${TEKS.ditangkap}</span><span class="tag ok">🏅 ${esc(l.badge)}</span>`:""}
        ${l.lock&&!unlocked?`<div class="mut"><small>🔒 Kumpul 3 lencana wilayah untuk membuka Liga Juara (${badges}/3)</small></div>`:""}
      </div>
      ${l.lock&&!unlocked?`<button class="ghost" disabled>🔒 Dikunci</button>`:`<button onclick="openL('${l.id}')">⚔️ ${p?TEKS.cubaLagi:TEKS.bertarung}</button>`}
    </div>`;
  }).join("");

  return topBar(TEKS.helo+" "+me.n,TEKS.kelas+" "+me.c)+
  `<div class="card">
    <div class="hud">
      <div class="avatar">🧢<span class="avatar-pokemon">${pokemon(25,52,"Pikachu")}</span></div>
      <div class="grow">
        <b>⭐ ${TEKS.tahap} ${lv} · XP ${xp}</b>
        <div class="bar xp" style="margin:.35rem 0"><i style="width:${xp%30/30*100}%"></i></div>
        <small class="mut">${TEKS.kemajuanAnda} ${pct(me)}% · 🏅 Lencana ${badges}/3</small>
      </div>
    </div>
    <div class="strip" aria-label="${TEKS.koleksi}">${strip}</div>
  </div>
  <div class="card stage"><div class="mon float">${mon("#ffcf33",0,84)}</div><div class="grow"><h2>🌍 Pokémon Language Adventure</h2><span class="tag">Bahasa Melayu Tahun 4</span><p class="mut" style="margin:.3rem 0 0">Jelajah Lingua Region, tangkap Pokémon dan jadi Penguasa Bahasa!</p></div><button onclick="LinguaGame.open()">🎮 Main Game</button></div>`+cards;
}

function lessonView(){
  const L=lessonObj(), m=monOf(L), mm=mon(m.c,m.k,124);
  if(B.ph==="learn"){
    return `<button class="ghost" onclick="closeL()">⬅ ${TEKS.kembali}</button>
    <div class="card center" style="margin-top:1rem">
      <div class="mon float" style="width:130px;margin:0 auto">${mon(m.c,m.k,130)}</div>
      <h2>${esc(m.n)} ${TEKS.liarMuncul}</h2>
      <span class="tag">${esc(L.title)}</span>
      ${L.lead?`<p><b>${esc(L.lead)}</b></p>`:""}
      <p class="bubble">${esc(L.text).replace(/\n/g,"<br>")}</p>
      <p class="mut">Jawab sekurang-kurangnya ${need(L)} daripada ${L.n} soalan dengan betul untuk menang.</p>
      <button onclick="startB()">⚡ ${TEKS.mulaB}</button>
    </div>`;
  }
  if(B.ph==="end"){
    const won=B.ok>=need(L);
    return `<div class="card center">
      <h2>${esc(L.title)}</h2>
      <div class="big">${B.ok}/${B.qs.length}</div>`+
      (won ? `<div class="capt"><div class="orb"></div><div class="mon">${mm}</div><span class="spark" style="left:18%;top:10%">✨</span><span class="spark" style="right:18%;top:20%">⭐</span></div><p><b>${TEKS.berjaya}</b></p><p>🏅 ${esc(L.badge)}</p>${L.lock?"<p><b>🏆 Tahniah! Anda kini PENGUASA BAHASA POKÉMON!</b></p>":""}`
           : `<div class="mon flee">${mm}</div><p>${TEKS.gagal}</p>`)+
      `<button onclick="closeL()">${TEKS.kembaliSenarai}</button>
    </div>`;
  }

  const q=B.qs[B.q], N=B.qs.length, fb=B.fb, hp=Math.max(0,Math.round((1-B.ok/N)*100));
  const hpClass = hp<35 ? " low" : hp<65 ? " mid" : "";
  return `
  <div class="arena${fb&&!fb.right?" miss":""}">
    <div class="arena-hills"></div>
    <i class="cloud">☁️</i><i class="cloud cloud-second">☁️</i>
    <div class="plate en">
      <b>${esc(m.n)}</b> <small>HP</small>
      <div class="bar hp${hpClass}"><i style="width:${hp}%"></i></div>
    </div>
    ${fb&&fb.right ? `<svg class="battle-bolt" viewBox="0 0 300 100" preserveAspectRatio="none"><polyline points="0,65 70,22 120,74 195,18 295,40" fill="none" stroke="#ffeb3b" stroke-width="10" stroke-linecap="round"/><polyline points="0,65 70,22 120,74 195,18 295,40" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></svg>` : ""}
    <div class="enemy">
      <div class="${fb&&fb.right?"hit":""}">${mm}</div>
      ${fb&&fb.right?`<span class="dmg">-${Math.round(100/N)}</span>`:""}
    </div>
    <div class="trainer">
      <span class="trainer-cap">🧢</span>
      <span class="trainer-word">JURULATIH</span>
      <span class="trainer-pokemon">${pokemon(25,58,"Pikachu")}</span>
    </div>
    <div class="plate me">${"❤️".repeat(Math.max(0,B.hp))}${"🖤".repeat(Math.max(0,L.hearts-B.hp))}</div>
  </div>
  <div class="card">
    <span class="tag">${TEKS.soalan} ${B.q+1}/${N}</span>
    <h2 style="margin-top:.55rem">${esc(q.q)}</h2>
    <div class="opts${fb?" lock":""}">`+
      q.o.map((o,j)=>`<button class="${fb?(j===q.a?"ok":j===fb.j?"no":"dim"):""}" onclick="answer(${j})">${esc(o)}</button>`).join("")+
    `</div>`+
    (fb?`<div class="fbbox ${fb.right?"good":"try"}">
      <b>${fb.right?"🎉 Betul! Serangan berjaya!":"💪 Tidak mengapa! Mari belajar bersama."}</b>
      <p>${fb.right?"":"Jawapan yang betul: <b>"+esc(q.o[q.a])+"</b>.<br>"}📘 ${esc(q.e)}</p>
      <p>✏️ Contoh: <i>${esc(q.x)}</i></p>
      <button onclick="nextQ()">${B.q+1>=N||B.hp<=0?"Lihat Keputusan 🏁":"Soalan Seterusnya ➡"}</button>
    </div>`:"")+
  `</div>`;
}

/* =====================================================================
   6) LOGIK KAWALAN & INTERAKSI
   ===================================================================== */
function render(){
  const a=$("#app");
  if(!S){
    Chiptune.setTrack("menu");
    a.innerHTML = !started ? startView() : (loginRole ? loginView() : home());
  } else if(S.role==="admin"){
    Chiptune.setTrack("menu");
    a.innerHTML=adminView();
  } else if(S.role==="guru"){
    Chiptune.setTrack("menu");
    a.innerHTML=guruView();
  } else {
    Chiptune.setTrack(lesson && B && B.ph==="fight" ? "battle" : "menu");
    a.innerHTML = lesson ? lessonView() : muridView();
  }
  msg=""; prefill={u:"",p:""};
}

const pick=r=>{Chiptune.enable();loginRole=r;msg="";render()};
const demoFill=(r,u,p)=>{Chiptune.enable();started=true;loginRole=r;prefill={u,p};msg="";render();window.scrollTo(0,0)};
const back=()=>{loginRole=null;render()};

function login(e){
  e.preventDefault();
  Chiptune.enable();
  const f=e.target, p=f.p.value, u=f.u?f.u.value.trim().toLowerCase():"";
  if(loginRole==="admin"){if(p===ADMIN_PASS) return setS({role:"admin"})}
  else{
    const x=(loginRole==="guru"?db.teachers:db.students).find(t=>t.u===u&&t.p0===p);
    if(x) return setS({role:loginRole,id:x.id});
  }
  bip(160,.2);
  msg=TEKS.salahLogin; render();
}

function openL(id){
  const L=LESSONS.find(l=>l.id===id); if(!L) return;
  if(L.lock){ // Liga Juara dikunci sehingga 3 lencana wilayah diperoleh
    const me=db.students.find(s=>s.id===S.id);
    const n=LESSONS.filter(x=>!x.lock&&me&&me.p[x.id]&&me.p[x.id].s>=need(x)).length;
    if(n<3){bip(160,.2);return}
  }
  lesson=id;B={ph:"learn",q:0,ok:0,hp:L.hearts||4,fb:null,qs:[]};render();window.scrollTo(0,0)
}
function closeL(){lesson=null;B=null;render()}
/* Kocok susunan (Fisher-Yates) */
function shuf(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[r[i],r[k]]=[r[k],r[i]]}return r}
/* Pilih soalan rawak daripada bank & kocok pilihan jawapan supaya tidak berulang */
function startB(){
  const L=lessonObj();
  B.qs=shuf(L.q).slice(0,L.n||L.q.length).map(q=>{
    const idx=shuf(q.o.map((_,i)=>i));
    return {q:q.q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a),e:q.e,x:q.x};
  });
  B.q=0;B.ok=0;B.hp=L.hearts||4;B.fb=null;
  bip(560,.1);B.ph="fight";render();
}

function answer(j){
  if(!B||B.fb) return;
  const q=B.qs[B.q], right=j===q.a;
  B.fb={j,right};
  if(right){B.ok++; Chiptune.thunder();}
  else{B.hp--; bip(140,.25);}
  render();
}
/* Pergi ke soalan seterusnya selepas murid membaca penjelasan */
function nextQ(){
  if(!B||!B.fb) return;
  B.fb=null; B.q++;
  if(B.q>=B.qs.length||B.hp<=0) finishB();
  else{render();window.scrollTo(0,0)}
}

function finishB(){
  const L=lessonObj(), me=db.students.find(s=>s.id===S.id), old=me.p[L.id];
  if(!old||B.ok>old.s) me.p[L.id]={s:B.ok,t:B.qs.length};
  save(); B.ph="end";
  if(B.ok>=need(L)) Chiptune.fanfare(); else bip(180,.3);
  render(); window.scrollTo(0,0);
}

/* Interaksi Pokémon Latar */
const BG_ACTIVITY={
  "bg-pikachu":{msg:"Pikachu menggunakan Thunderbolt! ⚡",sound:880},
  "bg-jigglypuff":{msg:"Jigglypuff menyanyikan lagu 8-bit! 🎵",sound:660},
  "bg-eevee":{msg:"Eevee bersorak untuk anda! ✨",sound:520}
};
function setupBackgroundPokemon(){
  document.querySelectorAll(".bg-pokemon").forEach(el=>{
    const act=()=>{
      const a=BG_ACTIVITY[el.id]; if(!a) return;
      const old=document.querySelector(".pokemon-bubble"); if(old) old.remove();
      const b=document.createElement("div"); b.className="pokemon-bubble"; b.textContent=a.msg;
      document.body.appendChild(b);
      const r=el.getBoundingClientRect();
      b.style.left=Math.max(8,Math.min(r.left,window.innerWidth-230))+"px";
      b.style.top=Math.max(8,r.top-52)+"px";
      bip(a.sound,.14);
      setTimeout(()=>b.remove(),2200);
    };
    el.addEventListener("click",act);
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ") act();});
  });
}

seedDemo();
setupBackgroundPokemon();
render();
