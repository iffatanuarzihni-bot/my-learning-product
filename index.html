<style>
:root{--ink:#1b1740;--paper:#fff8e7;--pri:#7c4dff;--gold:#ffc933;--grn:#2ecc71;--red:#ff4d6d;--mut:#5b5680}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:600 16px/1.5 "Baloo 2",system-ui,sans-serif;background:linear-gradient(#25156b,#4a2fb0 50%,#1e7fd6) fixed;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 140px 90px,#ffe9a0,transparent),radial-gradient(1.5px 1.5px at 80px 160px,#fff,transparent),radial-gradient(2px 2px at 200px 40px,#fff,transparent);background-size:240px 200px;animation:twinkle 2.5s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.25}}
.wrap{position:relative;max-width:900px;margin:0 auto;padding:1.2rem 1rem 3rem;animation:pop .35s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
h1,h2{margin:0 0 .5rem;line-height:1.3}
h1{font:400 1.2rem/1.6 "Press Start 2P","Courier New",monospace;color:var(--gold);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}

h2{font-size:1.3rem;font-weight:800}

.mut{color:var(--mut)}.top .mut{color:#e6defc}
button{font:inherit;font-weight:800;cursor:pointer;border:3px solid var(--ink);border-radius:12px;padding:.55rem 1rem;background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}
button:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}

button.ghost{background:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
input{font:inherit;padding:.55rem .7rem;border:3px solid var(--ink);border-radius:10px;width:100%;background:#fff;color:var(--ink)}
label{display:block;font-weight:800;font-size:.9rem;margin-bottom:.2rem}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:1.1rem;margin-bottom:1.2rem;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;align-items:end}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}
.tag{display:inline-block;padding:0 .6rem;border:2px solid var(--ink);border-radius:99px;font-size:.8rem;font-weight:800;background:#d9ccff}
.tag.ok{background:#b8f2cd}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.5rem .4rem;border-bottom:2px dashed #d9cfb5;vertical-align:middle}
th{font-size:.85rem;color:var(--mut)}
.scroll{overflow-x:auto}
.bar{height:16px;background:#e5dcc3;border:3px solid var(--ink);border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:linear-gradient(#5df29a,#1fb86b);transition:width .6s}
.xp i{background:linear-gradient(#ffe066,#ffb300)}.hp.low i{background:linear-gradient(#ff8fa3,#ff4d6d)}
.err{background:#ffe0e6;color:#b3173a;border:3px solid var(--ink);padding:.6rem .8rem;border-radius:12px;margin-bottom:1rem}
.q{margin:1rem 0}
.mon svg{display:block;margin:auto;max-width:100%;height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.sil svg{filter:brightness(0) opacity(.35)}
.float{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.parade{display:flex;justify-content:center;gap:1rem;margin:.5rem 0 1rem}.parade .mon{width:90px}
.roles{display:grid;gap:1rem;margin-top:1rem}
.role{display:flex;align-items:center;gap:1rem;width:100%;text-align:left;padding:.7rem 1rem;background:var(--paper);box-shadow:0 6px 0 rgba(0,0,0,.35);border-radius:18px}
.role .mon{width:80px;flex:none}.role strong{font-size:1.4rem;display:block}
.role:hover .mon{animation:jump .5s}
@keyframes jump{40%{transform:translateY(-16px) scale(1.08)}}
.stage{display:flex;align-items:center;gap:1rem}.stage .mon{width:84px;flex:none}.grow{flex:1;min-width:0}
.hud{display:flex;gap:1rem;align-items:center}.avatar{font-size:2.6rem}
.strip{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.7rem}.strip .mon{width:46px}
.arena{position:relative;height:290px;margin-bottom:1.2rem;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:linear-gradient(#8fd3ff 0 58%,#6fcf6f 58%);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.cloud{position:absolute;top:14%;font-size:2rem;animation:drift 16s linear infinite}
@keyframes drift{from{left:-10%}to{left:105%}}
.enemy{position:absolute;right:9%;top:48px;width:130px}
.enemy:after{content:"";position:absolute;left:5%;right:5%;bottom:-8px;height:16px;border-radius:50%;background:rgba(0,0,0,.2);z-index:-1}
.enemy .mon{animation:bob 2s ease-in-out infinite}
.trainer{position:absolute;left:10%;bottom:14px;font-size:4rem;animation:bob 3s ease-in-out infinite}
.plate{position:absolute;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:.2rem .6rem;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.plate.en{left:4%;top:12px;width:46%}.plate.me{right:4%;bottom:12px}
.hit{animation:hit .5s}.miss{animation:hit .4s}
@keyframes hit{20%{transform:translateX(-12px);filter:brightness(2)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}}
.miss:after{content:"";position:absolute;inset:0;background:rgba(255,0,60,.35);animation:flash .5s forwards}
@keyframes flash{to{opacity:0}}
.dmg{position:absolute;left:30%;top:-8px;font:400 1.2rem "Press Start 2P",monospace;color:var(--red);text-shadow:2px 2px 0 var(--ink);animation:up .9s forwards}
@keyframes up{to{opacity:0;transform:translateY(-50px)}}
.opts{display:grid;gap:.6rem;margin-top:.6rem}.opts.lock{pointer-events:none}
.opts button{text-align:left;background:#fff}
.opts .ok{background:var(--grn);color:#fff}.opts .no{background:var(--red);color:#fff}.opts .dim{opacity:.5}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:.8rem 1rem;margin:.8rem 0;text-align:left}
.center{text-align:center}.big{font:400 2.2rem "Press Start 2P",monospace;margin:.4rem 0}
.capt{position:relative;height:150px;display:grid;place-items:center}
.capt .mon{width:120px;opacity:0;animation:appear .5s 2s forwards}
@keyframes appear{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.orb{position:absolute;width:72px;height:72px;border-radius:50%;border:4px solid var(--ink);background:linear-gradient(var(--pri) 0 44%,var(--ink) 44% 56%,#fff 56%);animation:orb 2s ease-in-out forwards}
.orb:after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:var(--gold);border:3px solid var(--ink)}
@keyframes orb{0%{transform:translateY(-130px) scale(.5);opacity:0}20%{transform:none;opacity:1}35%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}65%{transform:rotate(-25deg)}80%{transform:rotate(0)}100%{transform:scale(1.9);opacity:0}}
.spark{position:absolute;font-size:1.6rem;opacity:0;animation:appear .6s 2.1s forwards,twinkle 1s 2.7s infinite alternate}
.flee{width:120px;margin:0 auto;animation:flee 1.2s forwards}
@keyframes flee{to{transform:translateX(220px) rotate(25deg);opacity:0}}
@media (max-width:520px){h1.logo{font-size:1.05rem}.enemy{width:105px}.role .mon{width:64px}}

let AC;
function bip(f,d){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.12))}catch(e){}}

 {id:25,name:"Pikachu"}, {id:1,name:"Bulbasaur"}, {id:4,name:"Charmander"},

// Imej sprite Pokémon dimuatkan daripada repositori sprite awam PokeAPI.
function pokemon(id,w,label){
 const size=w||100;
 const name=label||((POKEDEX.find(p=>p.id===id)||{}).name||"Pokémon");
 return `<img class="pokemon-sprite" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png" alt="${esc(name)}" width="${size}" height="${size}" loading="lazy" decoding="async">`;
}
function mon(c,k,w){
 const p=POKEDEX[k]||POKEDEX[0];
 return pokemon(p.id,w,p.name);
}
const monOf=l=>l.mon||{n:"Pikachu",c:"#ffcf33",k:0};
const need=L=>Math.ceil(L.q.length*2/3);
const lessonObj=()=>LESSONS.find(l=>l.id===lesson);

 const got=l=>me.p[l.id]&&me.p[l.id].s>=need(l);
 const xp=Object.values(me.p).reduce((a,x)=>a+x.s*10,0),lv=1+Math.floor(xp/30);
 const strip=LESSONS.map(l=>{const m=monOf(l);return `<div class="mon ${got(l)?"float":"sil"}" title="${esc(m.n)}">${mon(m.c,m.k,46)}</div>`}).join("");

  `<button onclick="closeL()">${TEKS.kembaliSenarai}</button></div>`}
 const q=L.q[B.q],fb=B.fb,hp=Math.round((1-B.ok/L.q.length)*100);
 return `<div class="arena${fb&&!fb.right?" miss":""}">
 <div class="arena-hills"></div><img class="arena-deco arena-deco-left" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png" alt="Squirtle" loading="lazy">

}

function render(){
 const a=$("#app");
 if(!S)a.innerHTML=loginRole?loginView():home();
 else if(S.role==="admin")a.innerHTML=adminView();
 else if(S.role==="guru")a.innerHTML=guruView();
 else a.innerHTML=lesson?lessonView():muridView();
 msg="";prefill={u:"",p:""};
}
const pick=r=>{loginRole=r;msg="";render()};
const demoFill=(r,u,p)=>{loginRole=r;prefill={u:u,p:p};msg="";render();window.scrollTo(0,0)};
const back=()=>{loginRole=null;render()};
const logout=()=>{loginRole=null;lesson=null;B=null;result=null;setS(null)};
function login(e){
 e.preventDefault();const f=e.target,p=f.p.value,u=f.u?f.u.value.trim().toLowerCase():"";
 if(loginRole==="admin"){if(p===ADMIN_PASS)return setS({role:"admin"})}
 else{const x=(loginRole==="guru"?db.teachers:db.students).find(t=>t.u===u&&t.p0===p);if(x)return setS({role:loginRole,id:x.id})}
 msg=TEKS.salahLogin;render();
}
function addT(e){
 e.preventDefault();const f=e.target,u=f.u.value.trim().toLowerCase();
 if(db.teachers.some(t=>t.u===u)){msg=TEKS.guruSama;return render()}
 db.teachers.push({id:uid(),n:f.n.value.trim(),u,p0:f.p.value});save();render();
}
function delT(id){
 if(!confirm(TEKS.buangGuruTanya))return;
 db.teachers=db.teachers.filter(t=>t.id!==id);db.students=db.students.filter(s=>s.t!==id);save();render();
}
function addS(e){
